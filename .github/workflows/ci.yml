name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build --arch arm64

      - name: Test
        env:
          DCMDICTPATH: ${{ github.workspace }}/libs/dcmtk/share/dcmtk-3.6.8/dicom.dic
        run: swift test --arch arm64
